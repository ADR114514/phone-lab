name: android-ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APKs and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (core + all apps)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APKs
        run: |
          ./gradlew :apps:powertrace:assembleDebug \
                    :apps:signalmap:assembleDebug \
                    :apps:vibrodiag:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: apps/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  analysis:
    name: Python analysis pipeline on demo data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt

      - name: Check documentation links
        run: python tools/check-docs.py

      - name: Run end-to-end analysis on synthetic demo data
        run: python analysis/tests/run_all.py